name: Portfolio Projects

on:
  push:
    branches: [main]
    paths:
      - 'projects/effectproof/**'
      - 'projects/schedshrink/**'
      - '.github/workflows/portfolio-projects.yml'
  pull_request:
    paths:
      - 'projects/effectproof/**'
      - 'projects/schedshrink/**'
      - '.github/workflows/portfolio-projects.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [effectproof, schedshrink]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: ruff check src tests
      - if: matrix.project == 'effectproof'
        run: mypy src/effectproof
      - if: matrix.project == 'schedshrink'
        run: mypy src/schedshrink
