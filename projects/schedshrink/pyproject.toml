[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "schedshrink"
version = "0.1.0"
description = "Deterministic cooperative schedule exploration and minimal race-condition counterexamples."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Alexandre Mosiashvili" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
schedshrink = "schedshrink.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/schedshrink"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
packages = ["schedshrink"]
disallow_untyped_defs = true
warn_unused_ignores = true
strict_optional = true
