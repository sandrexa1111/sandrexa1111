[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "effectproof"
version = "0.1.0"
description = "Deterministic verification of observable state deltas"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Alexandre Mosiashvili"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
state-delta = "effectproof.cli:main"
effectproof = "effectproof.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/effectproof"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
